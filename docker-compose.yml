services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: genai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: document_intelligence

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U app_user -d document_intelligence"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: